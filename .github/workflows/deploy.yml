name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build do projeto (SSR + client)
        run: bun run build

      - name: Prerender estático (gera index.html por rota)
        run: node scripts/prerender.mjs

      - name: Copiar arquivos estáticos da Hostinger
        run: |
          cp -f public/.htaccess dist/client/.htaccess
          [ -f public/robots.txt ] && cp -f public/robots.txt dist/client/robots.txt || true
          [ -f public/sitemap.xml ] && cp -f public/sitemap.xml dist/client/sitemap.xml || true

      - name: Validar index.html gerado
        run: |
          if [ ! -f dist/client/index.html ]; then
            echo "::error::dist/client/index.html ausente. Abortando deploy."
            find dist/client -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "OK: index.html presente ($(wc -c < dist/client/index.html) bytes)"
          ls -la dist/client/

      - name: Deploy FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/client/
          server-dir: /
          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose
