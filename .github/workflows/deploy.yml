name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build do projeto
        run: bun run build

      - name: Mostrar arquivos gerados
        run: |
          ls -la dist/
          ls -la dist/client/
          find dist/client -maxdepth 2 -type f | sort | head -200

      - name: Preparar arquivos estáticos para Hostinger
        run: |
          cp -f public/.htaccess dist/client/.htaccess
          cp -f public/robots.txt dist/client/robots.txt
          cp -f public/sitemap.xml dist/client/sitemap.xml
          if [ ! -f dist/client/index.html ]; then
            echo "::error::dist/client/index.html não foi gerado. O deploy foi interrompido para evitar 403 na Hostinger."
            find dist -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Conferir public_html antes do envio
        run: ls -la dist/client/ && du -sh dist/client/

      - name: Deploy FTP para Hostinger (apenas client estático)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/client/
          server-dir: /
          dangerous-clean-slate: true
          dry-run: false
          log-level: verbose
